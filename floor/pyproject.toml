[tool.poetry]
name = "floor"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
pyserial = "^3.5"
flask = "^3.1.2"
pymidi = "^0.5.0"
mock = "^5.2.0"
gevent = "^25.8.2"
flask-cors = "^6.0.1"
flask-sock = "^0.6.0"
spidev = { version = "^3.7", markers = "sys_platform == 'linux'" }


[tool.poetry.group.dev.dependencies]
nose = "^1.3.7"
mock = "^5.2.0"
freezegun = "^1.5.5"
pytest = "^8.4.2"
black = "^25.1.0"
isort = "^6.0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target_version = ['py311']
include = 'floor/.*\.pyi?$'

[tool.isort]
profile = "black"
skip_gitignore = true
