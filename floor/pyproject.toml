[tool.poetry]
name = "floor"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
pyserial = "^3.5"
flask = "^3.1.2"
pymidi = "^0.5.0"
mock = "^5.2.0"
gevent = "^25.8.2"
flask-cors = "^6.0.1"
flask-sock = "^0.6.0"
spidev = { version = "^3.7", markers = "sys_platform == 'linux'" }


[tool.poetry.group.dev.dependencies]
nose = "^1.3.7"
mock = "^5.2.0"
freezegun = "^1.5.5"
pytest = "^8.4.2"
ruff = "^0.12.12"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = 'py313'
exclude = [
  ".git",
  "node_modules",
  ".pyenv",
  ".vscode"
]

[tool.ruff.format]
quote-style = 'preserve'

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    #"B",
    # flake8-simplify
    #"SIM",
    # isort
    "I",
]
ignore = [
  "E501",  # line length
]
